{% extends "base.html" %}
{% block title %}Đăng ký{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 bg-white rounded-xl shadow-md p-8">
    <h1 class="text-2xl font-bold text-center mb-6 text-gray-800">Đăng ký tài khoản</h1>
    {% if errors %}
    <div class="bg-red-50 text-red-700 p-3 rounded mb-4 text-sm">
        <ul class="list-disc list-inside">
        {% for e in errors %}<li>{{ e }}</li>{% endfor %}
        </ul>
    </div>
    {% endif %}
    <form method="post" action="/auth/register" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Họ tên *</label>
            <input type="text" name="full_name" required value="{{ form.full_name if form else '' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
            <input type="email" name="email" required value="{{ form.email if form else '' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500">
        </div>
        <!-- BUG-02: Phone is optional in form, though table 4.4 requires it -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại (tùy chọn)</label>
            <input type="text" name="phone" value="{{ form.phone if form else '' }}" placeholder="0912345678"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu *</label>
            <input type="password" name="password" required minlength="8"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500">
            <p class="text-xs text-gray-400 mt-1">Tối thiểu 8 ký tự, có chữ và số</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Ngày sinh</label>
            <input type="date" name="date_of_birth"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-primary-500">
            <!-- BUG-04: No min age restriction -->
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Giới tính</label>
            <select name="gender" class="w-full border border-gray-300 rounded-lg px-3 py-2">
                <option value="">-- Chọn --</option>
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
                <option value="Khác">Khác</option>
            </select>
        </div>
        <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg font-medium hover:bg-primary-700">Đăng ký</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-4">
        Đã có tài khoản? <a href="/auth/login" class="text-primary-600 hover:underline">Đăng nhập</a>
    </p>
</div>
{% endblock %}
